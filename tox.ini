[tox]
env_list = py, lint, type, build
min_version = 4.23
requires = tox-uv>=1.29

[testenv]
runner = uv-venv-lock-runner
description = run tests against the installed wheel
package = wheel
dependency_groups = dev
pass_env =
    UV_CACHE_DIR
    PGFACADE_TEST_DSN
commands = python -m pytest {posargs:tests}

[testenv:py312, py313, py314]
description = run tests on the selected Python version

[testenv:lint]
description = check lint and formatting
package = skip
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:type]
description = check package types
commands = mypy src tests/typing

[testenv:build]
description = build source and wheel distributions
package = skip
commands = uv build
