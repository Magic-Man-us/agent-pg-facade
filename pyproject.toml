[project]
name = "pgfacade"
version = "0.5.0"
description = "Async Postgres facade with REST (FastAPI) and MCP (FastMCP) interfaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings[yaml]>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "tox>=4.23",
    "tox-uv>=1.29",
    "mypy>=1.19",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
pgfacade = "pgfacade.presentation.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = ["integration: requires an isolated PGFACADE_TEST_DSN database"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long one-line assertions read better than wrapped ones

[tool.mypy]
files = ["src/pgfacade"]
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "LICENSE*" },
    { file = "src/**/*.py" },
    { file = "src/**/*.sql" },
    { file = "src/**/py.typed" },
]
